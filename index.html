<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Breakout</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.11.0/css/xterm.css">
  </link>
  <script type="module" src="index.mjs"></script>
</head>

<body>
  <script id="breakout_script"></script>
  <div class="page">
    <p>
      <a href="https://github.com/Kardbord/breakout">Kardbord's Breakout</a>
      is a simplified clone of the
      <a href="https://en.wikipedia.org/wiki/Breakout_(video_game)">classic Breakout game</a>.
    </p>

    <div id="terminalContainer">

        <div class="fakeButtons fakeClose"></div>
        <div class="fakeButtons fakeMinimize"></div>
        <div class="fakeButtons fakeZoom"></div>
      </div>
      <div id="terminal"></div>
    </div>
  </div>
</body>

</html>
